version = 1

; DUBLAJ MODU (gpu-mod): RTX 4080 SUPER ses servisinde (dubber-tts); cevirmen yalnizca RTX 4070'te.
; Bu sunucu CUDA_VISIBLE_DEVICES ile yalnizca 4070'i gorur, bu yuzden CUDA0 = RTX 4070.
; Gemma ayarlari models-video.ini ile ayni; goruntu eklentisi (mmproj) de var: dubber videonun kucuk resmine bakip erkek ya da kadin sesi secer.
; llama.cpp modelleri alfabetik listeler: hicbiri yukluyken dubber ilk listeleneni (gemma4-12b) ister.
; Hangisinin kullanilacagini secmek icin burada tek model birakin.

[*]
fit = on
fit-target = 1024,512
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
ubatch-size = 256
parallel = 1

[translategemma-12b]
model = C:\AI\models\translategemma-12b-it.Q6_K.gguf
ctx-size = 4096
fit-target = 512
temp = 0.0
device = CUDA0

[gemma4-12b]
model = C:\AI\models\gemma-4-12B-it-Q6_K.gguf
mmproj = C:\AI\models\mmproj-gemma-4-12B-it-F16.gguf
alias = claude-gemma
fit-target = 512
reasoning = on
reasoning-budget = 16384
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0
spec-type = draft-mtp
model-draft = C:\AI\models\gemma-4-12B-it-MTP-Q8_0.gguf
spec-draft-n-max = 4
device = CUDA0
